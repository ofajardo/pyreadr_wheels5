name: Build Pyreadr wheels

env:
  # A commit hash for the pyreadr repo, for which to build wheels.
  SOURCE_REF_TO_BUILD: c1123a2358076e76372210b1211eb1f9d6810dae 

on: [push]

jobs:
  build_wheels:
    name: Build wheel ${{ matrix.python }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        # Github Actions doesn't support pairing matrix values together, let's improvise
        # https://github.com/github/feedback/discussions/7835#discussioncomment-1769026
        buildplat:
          - [windows-2022, win_amd64, ""]
          - [macos-15-intel, macosx_x86_64, ""]
          - [macos-14, macosx_arm64, ""]
          - [ubuntu-22.04, manylinux_x86_64, ""]
          - [ubuntu-22.04-arm, manylinux_aarch64, ""]

        python: ["cp310", "cp311", "cp312", "cp313", "cp314", "cp315"]
        #python: ["cp312",]

    steps:
      - name: Checkout pyreadr-wheels
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Checkout pyreadr
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ofajardo/pyreadr
          ref: ${{ env.SOURCE_REF_TO_BUILD }}
          path: pyreadr
          submodules: true
          persist-credentials: false

      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          path-type: inherit
          location: C:\msys_build
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-zlib

      - name: Build wheels
        uses: pypa/cibuildwheel@8c2dcd2e96041a619f5ff03c9638d7941e2553a4  # v4.3.3
        env:
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
          SRC: ${{ github.workspace }}/pyreadstat
        with:
          package-dir: pyreadr
          output-dir: dist
          config-file: cibuildwheel.toml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.python }}-${{ matrix.buildplat[1] }}-${{ matrix.buildplat[2] }}
          path: ./dist/*.whl

  upload_anaconda:
      permissions:
        contents: write # for softprops/action-gh-release to create GitHub release
      name: Upload to Anaconda
      needs: [build_wheels]
      runs-on: ubuntu-latest
      steps:
      - uses: actions/download-artifact@v5
        id: download
        with:
          path: ./dist
          merge-multiple: true
      - name: Upload wheel
        uses: scientific-python/upload-nightly-action@b36e8c0c10dbcfd2e05bf95f17ef8c14fd708dbf # 0.6.2
        with:
          artifacts_path: dist
          anaconda_nightly_upload_token: ${{secrets.ANACONDA_TOKEN}}
          anaconda_nightly_upload_organization: ofajardo
